name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
      - name: Install ocicl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the prebuilt release binary; building ocicl from source would
          # mean compiling a large Lisp tree on every run.
          gh release download -R ocicl/ocicl \
            --pattern 'ocicl-*-linux-amd64.tar.gz' -O /tmp/ocicl.tar.gz --clobber
          mkdir -p /tmp/ocicl-bin
          tar -xzf /tmp/ocicl.tar.gz -C /tmp/ocicl-bin
          sudo install -m 0755 /tmp/ocicl-bin/ocicl /usr/local/bin/ocicl
          ocicl version
          ocicl setup >> ~/.sbclrc
      - name: Install dependencies
        run: ocicl install
      - name: Run tests
        run: sbcl --noinform --non-interactive --eval '(asdf:test-system :user-agents)'
      - name: Load the examples
        # The examples are a separate system that test-op does not reach.  They
        # use only exported symbols, so loading them is what catches a hole in
        # the public API.
        run: sbcl --noinform --non-interactive --eval '(asdf:load-system :user-agents/examples)'
