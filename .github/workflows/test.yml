name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
      - name: Install ocicl
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl /tmp/ocicl
          make -C /tmp/ocicl
          sudo make -C /tmp/ocicl install
          ocicl setup >> ~/.sbclrc
      - name: Install dependencies
        run: ocicl install
      - name: Run tests
        run: sbcl --noinform --non-interactive --eval '(asdf:test-system :user-agents)'
